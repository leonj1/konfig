name: Update Submodules

on:
  # Run manually
  workflow_dispatch: {}

jobs:
  update:
    runs-on: [self-hosted, linux, x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        submodules: 'recursive'
        token: ${{ secrets.SUBMODULES_ACCESS_TOKEN }}
      continue-on-error: true

    - name: Update submodules
      run: ./scripts/update-submodules.sh
